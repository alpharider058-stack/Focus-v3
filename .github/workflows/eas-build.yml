name: EAS Build iOS IPA

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS Build Profile (preview / production)'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - production
          - development

jobs:
  eas-build:
    name: Build via Expo EAS
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm install --legacy-peer-deps

      - name: 🚀 Setup Expo & EAS CLI
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 🔨 Trigger EAS Build
        run: |
          eas build --platform ios --profile ${{ github.event.inputs.profile }} --non-interactive --wait
